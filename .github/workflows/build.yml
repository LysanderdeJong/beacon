name: Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
      - name: Install dependencies
        run: go mod download
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -v -ldflags "-s -w" -trimpath -o beacon.exe ./cmd/beacon
        shell: pwsh
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: go build -v -ldflags "-s -w" -trimpath -o beacon ./cmd/beacon
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beacon-binaries-${{ runner.os }}
          path: |
            ./beacon.exe
            ./beacon
