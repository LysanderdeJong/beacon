<!DOCTYPE html>
<html lang="en" x-data="beacon" x-bind:class="theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="config.title || 'Beacon'"></title>
    <link rel="icon" x-bind:href="config.favicon || 'data:text/plain;base64,8J+UjA=='" type="image/x-icon">
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        
        
        /* Removed custom status classes using @apply; use Tailwind utility classes directly in HTML */
        
        .service-card {
            transition: all 0.3s ease;
        }
        
        .service-card:hover {
            transform: translateY(-2px);
        }
        
        .pulse-dot {
            animation: pulse-dot 2s infinite;
        }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .theme-dark {
            color-scheme: dark;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 3s infinite',
                    }
                }
            }
        }
    </script>
</head>
<body 
    x-cloak 
    class="min-h-screen transition-colors duration-300"
    x-bind:style="backgroundStyle"
>
    <!-- Header -->
    <header class="relative z-10 bg-white/90 dark:bg-gray-900/90 backdrop-blur-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-sm">B</span>
                    </div>
                    <h1 class="text-xl font-semibold text-gray-900 dark:text-white" x-text="config.title || 'Beacon'"></h1>
                </div>
                
                <div class="flex items-center space-x-4">
                    <!-- Connection Status -->
                    <div class="flex items-center space-x-2 text-sm">
                        <div 
                            class="w-2 h-2 rounded-full transition-colors"
                            x-bind:class="connected ? 'bg-green-500 pulse-dot' : 'bg-red-500'"
                        ></div>
                        <span class="text-gray-600 dark:text-gray-300" x-text="connected ? 'Connected' : 'Disconnected'"></span>
                    </div>
                    
                    <!-- Theme Toggle -->
                    <template x-if="config.theme?.allowToggle !== false">
                        <button 
                            @click="toggleTheme()"
                            class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
                            title="Toggle theme"
                        >
                            <svg x-show="theme === 'light'" class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                            </svg>
                            <svg x-show="theme === 'dark'" class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                            </svg>
                            <svg x-show="theme === 'auto'" class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </button>
                    </template>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Search Bar -->
        <div class="mb-6 flex justify-end">
            <input
                type="text"
                x-model="searchQuery"
                placeholder="Search services..."
                class="w-full max-w-sm px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
        </div>

        <!-- Loading State -->
        <div x-show="loading" class="flex items-center justify-center py-20">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
                <p class="text-gray-600 dark:text-gray-300">Loading services...</p>
            </div>
        </div>

        <!-- Error State -->
        <div x-show="error && !loading" class="mb-8">
            <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-4">
                <div class="flex">
                    <svg class="w-5 h-5 text-red-400 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800 dark:text-red-200">
                            Error loading configuration
                        </h3>
                        <p class="mt-1 text-sm text-red-700 dark:text-red-300" x-text="error"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Services Grid -->
        <div x-show="!loading && !error">
            <!-- Groups -->
            <template x-for="group in sortedGroups" :key="group.id || 'ungrouped'">
                <div class="mb-8">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-gray-900 dark:text-white" x-text="group.title"></h2>
                        <div class="flex items-center space-x-2 text-sm text-gray-500 dark:text-gray-400">
                            <span x-text="`${getGroupServices(group.id).length} services`"></span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        <template x-for="service in getGroupServices(group.id)" :key="service.id">
                            <div class="service-card bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-4 hover:shadow-md transition-colors" x-data="{ expanded: false }">
                                <!-- Service Header -->
                                <div class="flex items-center justify-between mb-3 cursor-pointer" @click="expanded = !expanded">
                                    <div class="flex items-center space-x-3">
                                        <!-- Service Icon -->
                                        <div class="flex-shrink-0">
                                            <template x-if="getServiceConfig(service.id)?.icon">
                                                <div x-html="renderIcon(getServiceConfig(service.id).icon)" class="w-8 h-8 flex items-center justify-center"></div>
                                            </template>
                                            <template x-if="!getServiceConfig(service.id)?.icon">
                                                <div class="w-8 h-8 bg-gray-100 dark:bg-gray-700 rounded-lg flex items-center justify-center">
                                                    <svg class="w-4 h-4 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                                    </svg>
                                                </div>
                                            </template>
                                        </div>
                                        
                                        <!-- Service Name -->
                                        <div>
                                            <h3 class="font-medium text-gray-900 dark:text-white" x-text="getServiceConfig(service.id)?.name || service.id"></h3>
                                        </div>
                                    </div>
                                    
                                    <!-- Status Indicator -->
                                    <div 
                                        class="flex items-center space-x-2 px-2.5 py-1 rounded-full text-xs font-medium border transition-colors"
                                            x-bind:class="{
                                                'bg-gray-100 text-gray-600 border-gray-200 dark:bg-gray-800 dark:text-gray-200 dark:border-gray-700': service.status === 'unknown',
                                                'bg-green-100 text-green-800 border-green-200 dark:bg-green-900 dark:text-green-200 dark:border-green-700': service.status === 'up',
                                                'bg-red-100 text-red-800 border-red-200 dark:bg-red-900 dark:text-red-200 dark:border-red-700': service.status === 'down',
                                                'bg-yellow-100 text-yellow-800 border-yellow-200 dark:bg-yellow-900 dark:text-yellow-200 dark:border-yellow-700': service.status === 'degraded'
                                            }"
                                    >
                                        <div 
                                            class="w-1.5 h-1.5 rounded-full pulse-dot transition-colors"
                                                x-bind:class="{
                                                    'bg-gray-400 dark:bg-gray-500': service.status === 'unknown',
                                                    'bg-green-500 dark:bg-green-400': service.status === 'up',
                                                    'bg-red-500 dark:bg-red-400': service.status === 'down',
                                                    'bg-yellow-500 dark:bg-yellow-400': service.status === 'degraded'
                                                }"
                                        ></div>
                                        <span x-text="service.status.charAt(0).toUpperCase() + service.status.slice(1)"></span>
                                    </div>
                                </div>
                                
                                <!-- Service Description -->
                                <template x-if="config.ui?.showDescriptions !== false && getServiceConfig(service.id)?.description">
                                    <p class="text-sm text-gray-600 dark:text-gray-300 mb-3 transition-colors" x-text="getServiceConfig(service.id).description"></p>
                                </template>

                                <!-- Expandable Response Time Graph -->
                                <template x-if="expanded">
                                    <div class="mt-3 mb-3 p-2 bg-gray-50 dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-700">
                                        <canvas :id="'rt-graph-' + service.id" class="w-full h-32"></canvas>
                                        <script>
                                            // Alpine.js nextTick to ensure canvas is rendered
                                            $nextTick(() => {
                                                if (!window.beaconResponseHistory) window.beaconResponseHistory = {};
                                                if (!window.beaconResponseHistory[service.id]) window.beaconResponseHistory[service.id] = [];
                                                // Add latest response time to history
                                                const now = Date.now();
                                                window.beaconResponseHistory[service.id].push({
                                                    t: now,
                                                    v: service.responseTimeMs
                                                });
                                                // Keep only last 6 hours
                                                window.beaconResponseHistory[service.id] = window.beaconResponseHistory[service.id].filter(pt => pt.t > now - 21600000);
                                                // Prepare data for Chart.js
                                                const data = {
                                                    labels: window.beaconResponseHistory[service.id].map(pt => new Date(pt.t).toLocaleTimeString()),
                                                    datasets: [{
                                                        label: 'Response Time (ms)',
                                                        data: window.beaconResponseHistory[service.id].map(pt => pt.v),
                                                        fill: false,
                                                        borderColor: 'rgb(59, 130, 246)',
                                                        backgroundColor: 'rgba(59,130,246,0.2)',
                                                        tension: 0.1
                                                    }]
                                                };
                                                const ctx = document.getElementById('rt-graph-' + service.id).getContext('2d');
                                                if (ctx) {
                                                    if (ctx._chartInstance) {
                                                        ctx._chartInstance.destroy();
                                                    }
                                                    ctx._chartInstance = new Chart(ctx, {
                                                        type: 'line',
                                                        data,
                                                        options: {
                                                            responsive: true,
                                                            plugins: {
                                                                legend: { display: false },
                                                            },
                                                            scales: {
                                                                x: { display: true, title: { display: false } },
                                                                y: { display: true, title: { display: true, text: 'ms' }, beginAtZero: true }
                                                            }
                                                        }
                                                    });
                                                }
                                            });
                                        </script>
                                    </div>
                                </template>
                                
                                <!-- Service Metrics -->
                                <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 transition-colors">
                                    <div class="flex items-center space-x-4">
                                        <template x-if="service.responseTimeMs > 0">
                                            <span x-text="`${service.responseTimeMs}ms`"></span>
                                        </template>
                                        <template x-if="service.httpStatus > 0">
                                            <span x-text="`HTTP ${service.httpStatus}`"></span>
                                        </template>
                                    </div>
                                    <template x-if="service.lastChecked">
                                        <span x-text="formatLastChecked(service.lastChecked)"></span>
                                    </template>
                                </div>
                                
                                <!-- Service URL (clickable) -->
                                <template x-if="getServiceConfig(service.id)?.url">
                                    <div class="mt-3 pt-3 border-t border-gray-100 dark:border-gray-700 transition-colors">
                                        <a 
                                            x-bind:href="getServiceConfig(service.id).url" 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            class="text-xs text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-200 flex items-center space-x-1"
                                        >
                                            <span x-text="getServiceConfig(service.id).url"></span>
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                            </svg>
                                        </a>
                                    </div>
                                </template>
                                
                                <!-- Error Message -->
                                <template x-if="service.error">
                                    <div class="mt-3 pt-3 border-t border-gray-100 dark:border-gray-700 transition-colors">
                                        <p class="text-xs text-red-600 dark:text-red-400 transition-colors" x-text="service.error"></p>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('beacon', () => ({
                config: {},
                services: {},
                loading: true,
                error: null,
                connected: false,
                reconnecting: false,
                reconnectAttempts: 0,
                theme: 'auto',
                eventSource: null,
                now: Date.now(),
                searchQuery: '',

                async init() {
                    this.loadTheme();
                    this.applyTheme();
                    await this.loadConfig();
                    this.connectSSE();
                    setInterval(() => {
                        this.now = Date.now();
                    }, 1000);
                },

                async loadConfig() {
                    try {
                        const response = await fetch('/api/config');
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        this.config = await response.json();
                        this.loading = false;
                    } catch (err) {
                        this.error = `Failed to load configuration: ${err.message}`;
                        this.loading = false;
                    }
                },

                connectSSE() {
                    // Prevent multiple simultaneous connection attempts
                    if (this.reconnecting) {
                        return;
                    }

                    // Close existing connection if it exists
                    if (this.eventSource) {
                        // Only close if not already closed
                        if (this.eventSource.readyState !== EventSource.CLOSED) {
                            this.eventSource.close();
                        }
                        this.eventSource = null;
                    }

                    this.reconnecting = true;
                    this.eventSource = new EventSource('/sse/health');
                    
                    this.eventSource.onopen = () => {
                        this.connected = true;
                        this.error = null;
                        this.reconnecting = false;
                        this.reconnectAttempts = 0; // Reset backoff counter on successful connection
                        console.log('SSE connection opened');
                    };

                    this.eventSource.onmessage = (event) => {
                        // Handle default events
                        console.log('SSE message:', event.data);
                    };

                    this.eventSource.addEventListener('snapshot', (event) => {
                        const data = JSON.parse(event.data);
                        this.services = {};
                        data.services.forEach(service => {
                            this.services[service.id] = service;
                        });
                    });

                    this.eventSource.addEventListener('service', (event) => {
                        const service = JSON.parse(event.data);
                        this.services[service.id] = service;
                    });

                    this.eventSource.addEventListener('config', async (event) => {
                        // Config was reloaded, fetch new config
                        await this.loadConfig();
                    });

                    this.eventSource.addEventListener('keepalive', (event) => {
                        // Optionally log or process keepalive events
                        console.log('SSE keepalive event received:', event.data);
                    });

                    this.eventSource.onerror = (event) => {
                        console.log('SSE error occurred, readyState:', this.eventSource.readyState);
                        this.connected = false;
                        this.reconnecting = false;
                        
                        // Only reconnect if the connection is actually closed
                        // ReadyState 2 = CLOSED, which means we should reconnect
                        if (this.eventSource.readyState === EventSource.CLOSED) {
                            // Add exponential backoff for reconnection
                            const delay = this.reconnectAttempts ? Math.min(30000, 1000 * Math.pow(2, this.reconnectAttempts)) : 1000;
                            this.reconnectAttempts = (this.reconnectAttempts || 0) + 1;
                            
                            console.log(`SSE connection closed, reconnecting in ${delay}ms (attempt ${this.reconnectAttempts})`);
                            
                            setTimeout(() => {
                                if (!this.connected && this.eventSource && this.eventSource.readyState === EventSource.CLOSED) {
                                    this.connectSSE();
                                }
                            }, delay);
                        }
                    };
                },

                get sortedGroups() {
                    const groups = [...(this.config.groups || [])];
                    
                    // Add ungrouped services
                    const ungroupedServices = (this.config.services || []).filter(s => !s.group);
                    if (ungroupedServices.length > 0) {
                        groups.push({ id: '', title: 'Services' });
                    }
                    
                    return groups;
                },

                getGroupServices(groupId) {
                    const configServices = this.config.services || [];
                    const groupServices = configServices.filter(s => (s.group || '') === groupId);

                    // Filter by search query
                    let filteredServices = groupServices;
                    if (this.searchQuery && this.searchQuery.trim() !== '') {
                        const q = this.searchQuery.trim().toLowerCase();
                        filteredServices = groupServices.filter(s => {
                            const name = (s.name || '').toLowerCase();
                            const id = (s.id || '').toLowerCase();
                            const desc = (s.description || '').toLowerCase();
                            return name.includes(q) || id.includes(q) || desc.includes(q);
                        });
                    }

                    const now = this.now;
                    return filteredServices.map(configService => {
                        let state = this.services[configService.id] || {
                            id: configService.id,
                            status: 'unknown',
                            lastChecked: null,
                            responseTimeMs: 0,
                            httpStatus: 0,
                            error: null,
                            nextCheck: null
                        };
                        // If nextCheck is set and now > nextCheck + 5000ms, mark status as unknown
                        if (state.nextCheck && now > (new Date(state.nextCheck).getTime() + 5000)) {
                            state = { ...state, status: 'unknown' };
                        }
                        return state;
                    });
                },

                getServiceConfig(serviceId) {
                    return (this.config.services || []).find(s => s.id === serviceId);
                },

                renderIcon(icon) {
                    if (icon.startsWith('data:') || icon.startsWith('http')) {
                        return `<img src="${icon}" alt="Service icon" class="w-8 h-8 rounded-lg">`;
                    } else if (icon.startsWith('/')) {
                        return `<img src="${icon}" alt="Service icon" class="w-8 h-8 rounded-lg">`;
                    } else {
                        // Assume it's an emoji or text
                        return `<span class="text-lg">${icon}</span>`;
                    }
                },

                formatLastChecked(timestamp) {
                    if (!timestamp) return '';
                    const date = new Date(timestamp);
                    const now = new Date();
                    const diff = now - date;
                    const seconds = Math.floor(diff / 1000);
                    const minutes = Math.floor(diff / 60000);
                    const hours = Math.floor(diff / 3600000);
                    const days = Math.floor(diff / 86400000);

                    if (seconds < 10) {
                        return 'Just now';
                    } else if (seconds < 60) {
                        return `${seconds}s ago`;
                    } else if (minutes < 60) {
                        return `${minutes}m ago`;
                    } else if (hours < 24) {
                        return `${hours}h ago`;
                    } else {
                        // Show date and time for older timestamps
                        return date.toLocaleString(undefined, {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    }
                },

                get backgroundStyle() {
                    if (!this.config.background) return '';
                    
                    const bg = this.config.background;
                    let style = '';
                    
                    if (bg.type === 'gradient') {
                        style = `background: ${bg.value}`;
                    } else if (bg.type === 'image') {
                        style = `background: url(${bg.value}) center/cover no-repeat`;
                    } else {
                        style = `background-color: ${bg.value}`;
                    }
                    
                    if (bg.blur > 0) {
                        style += `; backdrop-filter: blur(${bg.blur}px)`;
                    }
                    
                    return style;
                },

                loadTheme() {
                    const saved = localStorage.getItem('beacon.theme');
                    if (saved && ['light', 'dark', 'auto'].includes(saved)) {
                        this.theme = saved;
                    } else {
                        this.theme = this.config.theme?.default || 'auto';
                    }
                },

                toggleTheme() {
                    const themes = ['light', 'dark', 'auto'];
                    const currentIndex = themes.indexOf(this.theme);
                    this.theme = themes[(currentIndex + 1) % themes.length];
                    this.saveTheme();
                    this.applyTheme();
                },

                saveTheme() {
                    localStorage.setItem('beacon.theme', this.theme);
                },

                applyTheme() {
                    const html = document.documentElement;
                    
                    if (this.theme === 'dark') {
                        html.classList.add('dark');
                    } else if (this.theme === 'light') {
                        html.classList.remove('dark');
                    } else {
                        // Auto theme
                        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                            html.classList.add('dark');
                        } else {
                            html.classList.remove('dark');
                        }
                    }
                }
            }));
        });
    </script>
</body>
</html>
